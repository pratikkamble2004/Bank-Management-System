            <a class="nav-link nav-link-premium px-3" routerLink="/dashboard" routerLinkActive="active">

          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-premium px-3" routerLink="/upi" routerLinkActive="active">

            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-premium px-3" routerLink="/account" routerLinkActive="active">
              <i class="bi bi-person-badge me-1"></i> Account Details
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-premium px-3" routerLink="/transactions" routerLinkActive="active">
              <i class="bi bi-list-stars me-1"></i> Transactions
            </a>
          </li>
          <li class="nav-item">
